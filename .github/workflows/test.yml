# Runs the headless unit tests (make test: cadre/core, no GTK) on each push
# and pull request, with Racket and the Clojure CLI installed so the tests
# against a live Racket back end and nREPL run (CADRE_REQUIRE_LANGUAGES
# makes them fail rather than skip if either is missing). The smoke and
# performance tests need a display, so they run locally.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install SBCL
        run: brew install sbcl

      # Racket's own installer (the full distribution, for check-syntax and
      # the docs): Homebrew's cask breaks when Racket replaces a download.
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          variant: CS

      - name: Install the Clojure CLI
        run: |
          brew install clojure
          racket --version
          clojure -Sdescribe > /dev/null

      - name: Install Quicklisp
        run: |
          curl -fsSO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)' \
               --eval '(ql-util:without-prompting (ql:add-to-init-file))'

      - name: Check out the docset library next to Cadre
        run: git clone --depth 1 https://github.com/crazymevt/docset.git ../docset

      - name: Set a Git identity (the Git tests make commits)
        run: |
          git config --global user.name "Cadre CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Unit tests
        env:
          CADRE_REQUIRE_LANGUAGES: "1"
        run: make test
